# Render Blueprint for the API. The database lives outside Render (e.g. Neon), so its credentials are set in the dashboard.
services:
  - type: web
    name: cuentas-claras-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
