<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff6ea" />
    <meta name="description" content="Divide los gastos del paseo, la casa o la cena. Sin registro: creas el grupo, compartes el link y la app dice quién le paga a quién." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cuentas Claras</title>
    <script>
      // pick the theme before first paint so dark mode never flashes light
      try { var saved = localStorage.getItem('theme') } catch (e) {}
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
