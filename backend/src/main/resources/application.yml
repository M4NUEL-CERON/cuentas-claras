spring:
  application:
    name: cuentas-claras
  mvc:
    # errors come back as RFC 9457 problem details whose "detail" is safe to show
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cuentas}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # free-tier Postgres allows few connections
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # loads expense participants in batches instead of one query per expense
        default_batch_fetch_size: 100

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
