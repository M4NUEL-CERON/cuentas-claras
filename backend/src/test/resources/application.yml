spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:cuentas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

app:
  cors:
    allowed-origins: http://localhost:5173
